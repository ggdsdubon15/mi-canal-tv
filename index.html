<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canal de TV - Transmisión Cristiana en Vivo</title>
  
  <!-- Carga de la librería HLS.js para reproducción de transmisiones IPTV/HLS -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #1e293b;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .live-badge {
      background-color: #ef4444;
      color: white;
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
    }
    .video-wrapper {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #000;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    video, iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .info-card {
      width: 100%;
      background-color: #1e293b;
      margin-top: 1.5rem;
      padding: 1.5rem;
      border-radius: 12px;
      border: 1px solid #334155;
    }
    .info-card h2 {
      color: #38bdf8;
      margin-bottom: 0.5rem;
    }
    .info-card p {
      color: #94a3b8;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-container">
      <h1>📺 Canal Fe & Alabanza</h1>
    </div>
    <span class="live-badge">EN VIVO</span>
  </header>

  <main>
    <div class="video-wrapper">
      <!-- Opción A: Si usas una transmisión HLS / .m3u8 -->
      <video id="videoPlayer" controls autoplay muted poster="https://via.placeholder.com/1280x720/1e293b/38bdf8?text=Cargando+Transmisión..."></video>
      
      <!-- Opción B: Si prefieres incrustar el reproductor de Twitch o YouTube (descomenta para usar) -->
      <!-- 
      <iframe src="https://player.twitch.tv/?channel=TU_CANAL&parent=localhost" allowfullscreen></iframe> 
      -->
    </div>

    <div class="info-card">
      <h2>Transmisión en directo</h2>
      <p>Bienvenido a nuestro canal. Aquí podrás disfrutar de alabanzas continuo, reflexiones y nuestros programas en vivo.</p>
    </div>
  </main>

  <script>
    const video = document.getElementById('videoPlayer');
    
    // Pones aquí tu enlace de transmisión en vivo .m3u8
    const streamUrl = 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8';

    if (Hls.isSupported()) {
      const hls = new Hls({ enableWorker: true });
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play();
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', function () {
        video.play();
      });
    }
  </script>

</body>
</html>
